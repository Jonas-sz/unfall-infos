name: Update news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: ["fetch_news.py"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "update news" && git push)
